services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: career_radar
      POSTGRES_PASSWORD: career_radar
      POSTGRES_DB: career_radar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career_radar"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://career_radar:career_radar@db:5432/career_radar
      ENVIRONMENT: development
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["python", "-c", "print('worker placeholder: queue wired in Epic 11')"]
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  pgdata:
  frontend_node_modules:
